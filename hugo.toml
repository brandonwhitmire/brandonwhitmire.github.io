baseURL = 'https://brandonwhitmire.github.io/'
title = 'brandonwhitmire'
pagination.pagerSize = 20

[markup.highlight]
  noClasses = false

[params]
  githubUser = 'brandonwhitmire'
  contentTypeName = 'posts'
  showMenuItems = 2
  fullWidthTheme = false
  centerTheme = true

  [params.social]
    email = 'kyle@brandonwhitmire.com'
    linkedin = 'https://www.linkedin.com/in/b-kyle-whitmire/'

[languages.en]
  label = 'English'
  title = 'brandonwhitmire'

  [languages.en.params]
    subtitle = 'Projects'

    [languages.en.params.logo]
      logoText = 'brandonwhitmire'
      logoHomeLink = '/'

  [languages.en.menu]
    [[languages.en.menu.main]]
      identifier = 'github'
      name = 'GitHub'
      url = 'https://github.com/brandonwhitmire'

[module]
  [[module.imports]]
    path = 'github.com/panr/hugo-theme-terminal/v4'
